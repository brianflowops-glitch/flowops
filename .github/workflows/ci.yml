name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No real secrets in CI. The build is designed to run without DATABASE_URL /
      # BETTER_AUTH_SECRET (DB and auth are created lazily at request time), and tests use an
      # in-process PGlite database with dummy values set in vitest.config.mts.
    services:
      # Throwaway Postgres for tests/*.pg.test.ts (real-Postgres integration tests).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops-ci-only
          POSTGRES_DB: flowops_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next 16 declares route types (e.g. the global LayoutProps) in generated files; without
      # this, `tsc --noEmit` fails on a clean checkout with two LayoutProps errors.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          # Local CI service container only (helpers refuse non-localhost URLs).
          TEST_DATABASE_URL: postgres://flowops:flowops-ci-only@localhost:5432/flowops_ci

      - name: Build
        run: npm run build
