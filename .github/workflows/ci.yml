name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No real secrets in CI. The build is designed to run without DATABASE_URL /
      # BETTER_AUTH_SECRET (DB and auth are created lazily at request time), and tests use an
      # in-process PGlite database with dummy values set in vitest.config.mts.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next 16 declares route types (e.g. the global LayoutProps) in generated files; without
      # this, `tsc --noEmit` fails on a clean checkout with two LayoutProps errors.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
